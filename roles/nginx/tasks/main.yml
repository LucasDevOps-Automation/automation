---
# Role Nginx - Tarefas

- name: Instalar Nginx
  package:
    name: nginx
    state: present
  become: yes

- name: Criar diretório de configuração customizada
  file:
    path: /etc/nginx/conf.d
    state: directory
    mode: '0755'
  become: yes

- name: Copiar template de configuração Nginx
  template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    backup: yes
  become: yes
  notify: Restart nginx

- name: Iniciar e habilitar Nginx
  service:
    name: nginx
    state: started
    enabled: yes
  become: yes

- name: Permitir HTTP através do firewall
  ufw:
    rule: allow
    name: "Nginx Full"
  become: yes
  when: enable_firewall | default(false)
  ignore_errors: yes

- name: Verificar status do Nginx
  systemd:
    name: nginx
    state: started
  become: yes
