---
# Role MySQL - Tarefas

- name: Instalar MySQL Server
  package:
    name: 
      - mysql-server
      - python3-pymysql
    state: present
  become: yes

- name: Iniciar e habilitar MySQL
  service:
    name: mysql
    state: started
    enabled: yes
  become: yes

- name: Copiar arquivo de configuração MySQL
  template:
    src: my.cnf.j2
    dest: /etc/mysql/my.cnf
    backup: yes
  become: yes
  notify: Restart mysql

- name: Configurar MySQL com ansible
  mysql_user:
    name: root
    password: "{{ mysql_root_password | default('') }}"
    login_unix_socket: /var/run/mysqld/mysqld.sock
  become: yes
  when: mysql_root_password is defined
  ignore_errors: yes

- name: Remover anonymous MySQL user
  mysql_user:
    name: ''
    host: "{{ item }}"
    state: absent
  loop:
    - localhost
    - "{{ ansible_fqdn }}"
  become: yes
  ignore_errors: yes

- name: Remover database de teste
  mysql_db:
    name: test
    state: absent
  become: yes
  ignore_errors: yes

- name: Permitir MySQL através do firewall
  ufw:
    rule: allow
    port: "{{ db_port }}"
    proto: tcp
  become: yes
  when: enable_firewall | default(false)
  ignore_errors: yes
