---
# Role Common - Tarefas comuns para todos os hosts

# Instalar pacotes de base
- name: Instalar pacotes comuns
  package:
    name: "{{ common_packages }}"
    state: present
  become: yes

# Configurar timezone
- name: Configurar timezone
  timezone:
    name: "{{ timezone }}"
  become: yes

# Atualizar hostname
- name: Configurar hostname
  hostname:
    name: "{{ inventory_hostname }}"
  become: yes

# Configurar /etc/hosts
- name: Garantir que o hostname está em /etc/hosts
  lineinfile:
    path: /etc/hosts
    line: "127.0.1.1 {{ inventory_hostname }}"
    regexp: "^127.0.1.1"
    state: present
  become: yes

# Criar usuário de aplicação
- name: Criar grupo de aplicação
  group:
    name: "{{ app_group }}"
    state: present
  become: yes

- name: Criar usuário de aplicação
  user:
    name: "{{ app_user }}"
    group: "{{ app_group }}"
    home: "{{ app_home }}"
    shell: /bin/bash
    createhome: yes
    state: present
  become: yes

# Configurar SSH
- name: Configurar SSH keys
  authorized_key:
    user: "{{ ansible_user }}"
    state: present
    key: "{{ item }}"
  loop: "{{ ssh_public_keys | default([]) }}"
  become: yes
  ignore_errors: yes

# Configurar firewall básico (ufw para Ubuntu)
- name: Ativar firewall UFW
  ufw:
    state: enabled
    policy: deny
    direction: incoming
  become: yes
  when: 
    - ansible_os_family == "Debian"
    - enable_firewall | default(false)
  ignore_errors: yes

# Permitir SSH
- name: Permitir SSH através do firewall
  ufw:
    rule: allow
    name: OpenSSH
  become: yes
  when: 
    - ansible_os_family == "Debian"
    - enable_firewall | default(false)
  ignore_errors: yes

# Sincronizar hora do sistema
- name: Instalar NTP
  package:
    name: chrony
    state: present
  become: yes

- name: Iniciar serviço de sincronização de hora
  service:
    name: chrony
    state: started
    enabled: yes
  become: yes

# Criar diretório de logs
- name: Criar diretório de logs
  file:
    path: /var/log/{{ project_name }}
    state: directory
    mode: '0755'
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
  become: yes
